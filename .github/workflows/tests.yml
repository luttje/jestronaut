name: tests
on:
  push:
    branches:
      - main
    paths:
      - 'libs/**'
      - 'tests/**'
      - 'test.lua'
      - 'main.lua'
      - 'bin/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'libs/**'
      - 'tests/**'
      - 'test.lua'
      - 'main.lua'
      - 'bin/**'
      - '.github/workflows/tests.yml'
jobs:
  # Runs the test suite with each supported Lua interpreter directly.
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.1", "5.2", "5.3", "5.4", "luajit-openresty"]

    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.luaVersion }}
      # LuaJIT is installed as `luajit` rather than `lua`
      - name: Select the Lua interpreter
        run: echo "LUA=$(command -v lua || command -v luajit)" >> "$GITHUB_ENV"
      - name: Run the test suite
        run: $LUA test.lua
      - name: Run the runner integration checks
        run: $LUA tests/integration.lua
      - name: Verify a failing test run exits with a non-zero status code
        run: |
          if $LUA tests/fixtures/failing-run.lua > /dev/null; then
            echo "Expected tests/fixtures/failing-run.lua to exit with a non-zero status code"
            exit 1
          fi
      - name: Verify tests can be written without globals
        run: $LUA tests/fixtures/no-globals-run.lua
      - name: Verify the jestronaut command runs test files
        run: |
          $LUA -e 'package.path = "./libs/?.lua;" .. package.path' bin/jestronaut tests/fixtures/cli/math_test.lua tests/fixtures/cli/strings_test.lua

          if $LUA -e 'package.path = "./libs/?.lua;" .. package.path' bin/jestronaut tests/fixtures/cli/broken_test.lua > /dev/null; then
            echo "Expected the jestronaut command to exit with a non-zero status code for a failing test"
            exit 1
          fi

  # Builds the LuaRocks module and lit binary, runs the suite through luvi and reports coverage.
  build-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install Luvit
        run: curl -L https://github.com/luvit/lit/raw/master/get-lit.sh | sh
      - name: Make lit and luvit available and executable
        run: |
          sudo cp lit /usr/local/bin/lit
          sudo chmod +x /usr/local/bin/lit
          sudo cp luvit /usr/local/bin/luvit
          sudo chmod +x /usr/local/bin/luvit
          sudo cp luvi /usr/local/bin/luvi
          sudo chmod +x /usr/local/bin/luvi
      - name: Install LuaCov
        run: luarocks install luacov
      - name: Install the LuaCov LCOV reporter
        run: luarocks install luacov-reporter-lcov
      - name: Install dependencies
        run: npm ci
      - name: Build the LuaRocks module and Lit binary
        run: npm run build
      - name: Test package
        run: npm run ci:test
      - run: mv ./luacov.report.out ./luacov.lcov
      - uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: ./luacov.lcov
